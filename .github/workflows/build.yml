name: Build Azure Func
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: az bicep build --file .infra/main.bicep --outfile /tmp/main.json
      - run: az bicep build --file .infra/apim/main.bicep --outfile /tmp/apim.json
      - name: Check shell syntax
        run: |
          for script in .infra/scripts/*.sh; do
            bash -n "$script"
          done
      - run: dotnet restore Internal.ProductionCalendar.slnx
      - run: dotnet build Internal.ProductionCalendar.slnx --no-restore -c Release

